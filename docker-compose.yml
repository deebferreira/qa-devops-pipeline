services:

  postgres:
    image: postgres:16
    container_name: qa-pipeline-postgres

    environment:
      POSTGRES_DB: qapipeline
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d qapipeline"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: qa-pipeline-api

    ports:
      - "8080:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/qapipeline
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: